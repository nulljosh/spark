name: Spark
options:
  bundleIdPrefix: com.heyitsmejosh
  deploymentTarget:
    iOS: "17.0"
packages:
  SwiftLint:
    url: https://github.com/realm/SwiftLint
    from: 0.59.1
settings:
  DEVELOPMENT_TEAM: QMM486NPYC
  SWIFT_VERSION: "6.0"
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "3"
schemes:
  Spark:
    build:
      targets:
        Spark: all
        SparkUITests: [test]
    test:
      targets:
        - SparkUITests
    run:
      config: Debug
    shared: true
targets:
  Spark:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - "*.xcodeproj"
          - "*.yml"
          - ".git"
          - ".gitignore"
          - "README.md"
          - "CLAUDE.md"
          - "architecture.svg"
          - "SparkTests"
          - "UITests"
          - "scripts"
          - "icon.svg"
          - "fastlane"
          - ".asc"
    settings:
      INFOPLIST_FILE: Info.plist
      PRODUCT_BUNDLE_IDENTIFIER: com.heyitsmejosh.spark
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "iPhone Distribution"
      PROVISIONING_PROFILE_SPECIFIER: "Sparkjar iOS App Store 20260810"
    entitlements:
      path: Spark.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.jt.spark
        # Required for the native SignInWithAppleButton. xcodegen regenerates
        # Spark.entitlements from this block, so it must live here — editing
        # the .entitlements file directly gets clobbered on `xcodegen generate`.
        com.apple.developer.applesignin:
          - Default
    dependencies:
      - target: SparkWidgetsExtension
    buildToolPlugins:
      - plugin: SwiftLintBuildToolPlugin
        package: SwiftLint
  SparkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SparkTests
    dependencies:
      - target: Spark
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.heyitsmejosh.spark.tests
      GENERATE_INFOPLIST_FILE: YES
  SparkUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Spark
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.heyitsmejosh.spark.uitests
      GENERATE_INFOPLIST_FILE: YES
  SparkWidgetsExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ../widgets-ios
        excludes:
          - "*.xcodeproj"
          - "*.yml"
          - "*.md"
          - "*.svg"
    settings:
      INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright 2026 Joshua Trommel"
      PRODUCT_BUNDLE_IDENTIFIER: com.heyitsmejosh.spark.widgets
      ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
      PRODUCT_NAME: SparkWidgets
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "iPhone Distribution"
      PROVISIONING_PROFILE_SPECIFIER: "Spark Widgets App Store"
    info:
      path: ../widgets-ios/Info.plist
      properties:
        CFBundleDisplayName: Spark Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ../widgets-ios/SparkWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.jt.spark
